        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/staff/{staff_id}/deactivate:
    post:
      tags: [admin]
      summary: Nonaktifkan akun staf
      description: Admin tidak bisa mengubah akunnya sendiri tanpa admin lain (`403 SELF_MODIFICATION_FORBIDDEN`). Sesi aktif akun dicabut.
      operationId: adminDeactivateStaff
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccount' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/staff/{staff_id}/unlock:
    post:
      tags: [admin]
      summary: Buka kunci akun staf
      description: Hanya admin. Satpam tidak boleh membuka kunci akunnya sendiri.
      operationId: adminUnlockStaff
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccount' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/staff/{staff_id}/reset-password:
    post:
      tags: [admin]
      summary: Reset password akun staf
      operationId: adminResetPassword
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '204':
          description: Password sementara dibuat; sesi akun dicabut.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/audit-logs:
    get:
      tags: [admin]
      summary: Baca audit log (FR-13)
      description: Read-only. Tidak ada endpoint ubah/hapus audit log. Membaca audit log sendiri tercatat.
      operationId: adminListAuditLogs
      security:
        - cookieAuth: []
      parameters:
        - name: staff_id
          in: query
          schema: { type: integer }
        - name: action
          in: query
          schema: { type: string }
        - name: entity_type
          in: query
          schema: { type: string }
        - name: entity_id
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page, page_size, total]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLogEntry' }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/audit-logs/export:
    get:
      tags: [admin]
      summary: Ekspor audit log CSV
      description: Filter sama dengan list. Ekspor itu sendiri tercatat di audit log. Nomor WhatsApp tidak pernah utuh.
      operationId: adminExportAuditLogs
      security:
        - cookieAuth: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/audit-logs/verify-integrity:
    post:
      tags: [admin]
      summary: Cek integritas rantai hash audit log
      description: Hitung ulang `entry_hash` dari `prev_hash` berurutan. Melaporkan entri pertama yang rantainya putus.
      operationId: adminVerifyAuditIntegrity
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, checked_entries]
                properties:
                  ok: { type: boolean }
                  checked_entries: { type: integer, format: int64 }
                  first_broken_audit_id: { type: integer, format: int64, nullable: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/anomaly-flags:
    get:
      tags: [admin]
      summary: Daftar penanda anomali A1-A8
      operationId: adminListAnomalyFlags
      security:
        - cookieAuth: []
      parameters:
        - name: rule_id
          in: query
          schema: { type: string, enum: [A1, A2, A3, A4, A5, A6, A7, A8] }
        - name: status
          in: query
          schema: { type: string, enum: [baru, ditinjau] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page, page_size, total]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AnomalyFlag' }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/anomaly-flags/{flag_id}/review:
    post:
      tags: [admin]
      summary: Tandai penanda "Ditinjau" dengan catatan
      operationId: adminReviewAnomalyFlag
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: flag_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_note]
              properties:
                review_note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnomalyFlag' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/settings:
    get:
      tags: [admin]
      summary: Baca parameter (bobot, ambang, batas, masa simpan)
      operationId: adminGetSettings
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Setting' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [admin]
      summary: Ubah parameter
      description: |
        Setiap perubahan tercatat (nilai lama dan baru). Validasi: jumlah bobot matching harus 1,00;
        `threshold_mid < threshold_high`; batas rate limit > 0. Perubahan berlaku untuk matching berikutnya, tidak menghitung ulang hasil lama.
      operationId: adminUpdateSettings
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes, reason]
              properties:
                changes:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: { type: string, example: match.weight.color }
                      value: { type: string, example: '0.35' }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Setting' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/items/{item_id}/hold:
    post:
      tags: [admin]
      summary: Tahan barang (sengketa / insiden)
      description: '`barang_ditemukan -> ditahan`. Barang `ditahan` tidak bisa diverifikasi atau diserahkan sampai admin melepas (BR-19). Alasan wajib.'
      operationId: adminHoldItem
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/items/{item_id}/release:
    post:
      tags: [admin]
      summary: Lepas barang yang ditahan
      description: '`ditahan -> barang_ditemukan`. Hanya admin (FR-09).'
      operationId: adminReleaseItem
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/items/aged:
    get:
      tags: [admin]
      summary: Barang melewati masa simpan (> 30 hari)
      operationId: adminListAgedItems
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page, page_size, total]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StaffItem' }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/items/{item_id}/transfer:
    post:
      tags: [admin]
      summary: Limpahkan barang sesuai SOP (> 30 hari)
      description: '`barang_ditemukan -> dilimpahkan`. Hanya jika lewat masa simpan 30 hari. SOP final: OI07.'
      operationId: adminTransferItem
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, destination_unit]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
                destination_unit: { type: string, maxLength: 120 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/categories:
    get:
      tags: [admin]
      summary: Daftar kategori (termasuk nonaktif)
      operationId: adminListCategories
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryAdmin' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: Tambah kategori
      operationId: adminCreateCategory
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryWrite' }
      responses:
        '201':
          description: Dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryAdmin' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/locations:
    get:
      tags: [admin]
      summary: Daftar lokasi (termasuk nonaktif)
      operationId: adminListLocations
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LocationAdmin' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: Tambah lokasi
      operationId: adminCreateLocation
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationWrite' }
      responses:
        '201':
          description: Dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationAdmin' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

# ====================================================================== COMPONENTS
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lf_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Wajib di semua request ubah data oleh staf.

  headers:
    RetryAfter:
      description: Detik sampai boleh mencoba lagi.
      schema: { type: integer }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4 per pengiriman formulir. Dibuat FE saat formulir dibuka, bukan saat tombol diklik.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    ItemId:
      name: item_id
      in: path
      required: true
      description: Item ID (label rak).
      schema: { type: string, example: B-0462 }
    FoundReportId:
      name: report_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/FoundReportCode' }
    LostReportId:
      name: report_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/LostReportCode' }
    ClaimId:
      name: claim_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    StaffId:
      name: staff_id
      in: path
      required: true
      schema: { type: integer }

  responses:
    ValidationError:
      description: Input tidak valid (`VALIDATION_ERROR`). Daftar `fields` per field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Belum login / sesi habis (`UNAUTHENTICATED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Role atau objek tidak diizinkan (`FORBIDDEN`), atau CSRF tidak valid (`CSRF_INVALID`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Tidak ditemukan (`NOT_FOUND`). Juga dipakai untuk objek yang tidak boleh diketahui keberadaannya.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: |
        Konflik status atau aturan bisnis. Kode: `INVALID_STATE_TRANSITION`, `ALREADY_HANDED_OVER`,
        `VERIFICATION_IN_PROGRESS`, `ALREADY_NOTIFIED`, `DUPLICATE_SUSPECTED`, `ITEM_ON_HOLD`, `FLAG_NOTE_REQUIRED`, `USERNAME_TAKEN`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Kena batas (`RATE_LIMITED`). Header `Retry-After` diisi.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TokenInvalidOrIdempotency:
      description: |
        Token verifikasi OTP palsu, kedaluwarsa, sudah dipakai, atau milik nomor/tujuan lain
        (`VERIFICATION_TOKEN_INVALID`, satu kode untuk semua alasan), atau `IDEMPOTENCY_KEY_REUSED`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Layanan WhatsApp/penyimpanan counter tidak tersedia (`SERVICE_UNAVAILABLE`). Fail closed untuk OTP.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------------------------------------------------------------- common
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Kode mesin yang stabil.
          example: VALIDATION_ERROR
        message:
          type: string
          description: Pesan umum untuk pengguna. Tanpa detail teknis atau data orang lain.
          example: Input tidak valid.
        request_id:
          type: string
          description: Untuk dicocokkan dengan log server.
        fields:
          type: array
          description: Hanya untuk `VALIDATION_ERROR`.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: description }
              message: { type: string, example: Deskripsi minimal 10 karakter. }

    ReasonBody:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    LostReportCode:
      type: string
      pattern: '^HL-[A-Z0-9]{4}-[A-Z0-9]{4}$'
      example: HL-3M7R-9DQ2
    FoundReportCode:
      type: string
      pattern: '^TM-[A-Z0-9]{4}-[A-Z0-9]{4}$'
      example: TM-8K2P-4WXN

    FoundReportStatus:
      type: string
      enum: [menunggu_penyerahan, diterima, ditolak, kedaluwarsa]
    ItemStatus:
      type: string
      enum: [barang_ditemukan, proses_verifikasi, telah_diambil, ditahan, dilimpahkan]
    LostReportStatus:
      type: string
      enum: [aktif, memiliki_kandidat, selesai, ditutup]
    NotificationStatus:
      type: string
      enum: [pending, terkirim, gagal, ulang]
    MatchBand:
      type: string
      enum: [tinggi, sedang, rendah, data_tidak_memadai]
    Role:
      type: string
      enum: [satpam, admin]

    # ---------------------------------------------------------------- options
    CategoryOption:
      type: object
      required: [category_id, name]
      properties:
        category_id: { type: integer }
        name: { type: string, example: Dompet }
    ColorOption:
      type: object
      required: [code, label]
      properties:
        code: { type: string, example: hitam, description: "Kode `lainnya` = komponen warna tidak dihitung di matching." }
        label: { type: string, example: Hitam }
    LocationOption:
      type: object
      required: [location_id, name]
      properties:
        location_id: { type: integer }
        name: { type: string, example: Perpustakaan Pusat }
        is_other:
          type: boolean
          description: true untuk opsi "Lainnya" (komponen lokasi tidak dihitung).

    # ---------------------------------------------------------------- OTP
    PhoneNumber:
      type: string
      description: Format `08...` atau `+62...`. Server menormalkan ke `+62` dan menolak non-Indonesia. 10-14 digit setelah 0 (lihat `x-open-questions` no. 5).
      example: '081234567890'
    OtpPurpose:
      type: string
      enum: [lapor_hilang, lapor_temuan]
    OtpRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        purpose: { $ref: '#/components/schemas/OtpPurpose' }
        captcha_token:
          type: string
          description: Wajib bila server sebelumnya membalas `CAPTCHA_REQUIRED`.
    OtpRequestAccepted:
      type: object
      required: [expires_in, resend_after]
      properties:
        expires_in: { type: integer, example: 300, description: Detik masa berlaku kode. }
        resend_after: { type: integer, example: 60, description: Detik sampai boleh minta ulang. }
    OtpVerify:
      type: object
      required: [phone, purpose, code]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        purpose: { $ref: '#/components/schemas/OtpPurpose' }
        code:
          type: string
          pattern: '^[0-9]{6}$'
    OtpVerified:
      type: object
      required: [verification_token, expires_in]
      properties:
        verification_token:
          type: string
          description: Sekali pakai, terikat nomor + tujuan. Jangan dicatat di log atau URL.
        expires_in: { type: integer, example: 900 }

    # ---------------------------------------------------------------- public reports
    LostReportCreate:
      type: object
      required: [verification_token, category_id, color, location_id, lost_at, description, reporter_name, reporter_whatsapp, consent]
      properties:
        verification_token: { type: string }
        category_id: { type: integer }
        color: { type: string, example: hitam }
        location_id: { type: integer }
        lost_at:
          type: string
          format: date-time
          description: Perkiraan waktu hilang. Tidak di masa depan, tidak lebih dari 60 hari lalu.
        description:
          type: string
          minLength: 10
          maxLength: 300
          description: Karakter kontrol (kecuali baris baru) ditolak. Disimpan apa adanya, di-escape saat tampil.
        reporter_name:
          type: string
          minLength: 3
          maxLength: 60
          description: Huruf, spasi, titik, apostrof, tanda hubung.
        reporter_whatsapp: { $ref: '#/components/schemas/PhoneNumber' }
        consent:
          type: boolean
          enum: [true]
          description: Waktu persetujuan disimpan server.
        website:
          type: string
          description: Honeypot. Disembunyikan di UI. Harus kosong.
    LostReportCreated:
      type: object
      required: [report_id, status]
      properties:
        report_id: { $ref: '#/components/schemas/LostReportCode' }
        status: { type: string, enum: [aktif] }
        notice:
          type: string
          example: Kabar kecocokan dikirim lewat WhatsApp.

    FoundReportCreate:
      type: object
      required: [verification_token, category_id, color, location_id, found_at, description, reporter_whatsapp, consent]
      properties:
        verification_token: { type: string }
        category_id: { type: integer }
        color: { type: string }
        location_id: { type: integer }
        found_at: { type: string, format: date-time }
        description: { type: string, minLength: 10, maxLength: 300 }
        photo: { type: string, format: binary }
        finder_name:
          type: string
          maxLength: 60
          description: Opsional.
        reporter_whatsapp: { $ref: '#/components/schemas/PhoneNumber' }
        consent: { type: boolean }
        website: { type: string, description: Honeypot. }
    FoundReportCreated:
      type: object
      required: [report_id, status, expires_at, handover_info]
      properties:
        report_id: { $ref: '#/components/schemas/FoundReportCode' }
        status: { type: string, enum: [menunggu_penyerahan] }
        expires_at:
          type: string
          format: date-time
          description: created_at + 24 jam.
        handover_info:
          type: object
          required: [post_name, service_hours]
          properties:
            post_name: { type: string, example: Pos Satpam Gedung Rektorat }
            service_hours: { type: string, example: 'Senin-Jumat 07.00-17.00' }

    # ---------------------------------------------------------------- public items (ALLOWLIST)
    PublicItem:
      type: object
      description: |
        **DTO allowlist FR-04 / SEC-04.** Hanya field di bawah. `additionalProperties: false`:
        QA (AC-S04) mengecek respons tidak punya key lain.
        Tidak pernah: foto, deskripsi, nama bebas, lokasi, tanggal/jam penemuan, rak, data penemu.
      additionalProperties: false
      required: [item_id, category, color, post]
      properties:
        item_id: { type: string, example: B-0462 }
        category:
          type: object
          additionalProperties: false
          required: [category_id, name]
          properties:
            category_id: { type: integer }
            name: { type: string }
        color:
          type: object
          additionalProperties: false
          required: [code, label]
          properties:
            code: { type: string }
            label: { type: string }
        post:
          type: object
          additionalProperties: false
          required: [name, service_hours]
          properties:
            name: { type: string }
            service_hours: { type: string }
        received_label:
          type: string
          enum: [hari_ini, kemarin, minggu_ini, lebih_lama]
          description: Opsional, bentuk kasar "masuk pos". Dihitung di server, bukan timestamp.
    PublicItemDetail:
      allOf:
        - $ref: '#/components/schemas/PublicItem'
        - type: object
          required: [pickup_steps]
          properties:
            pickup_steps:
              type: array
              description: Langkah pengambilan di pos + kontak BSI.
              items: { type: string }
            bsi_contact:
              type: string
              description: Kontak BSI untuk pengaduan (OI08).

    # ---------------------------------------------------------------- auth
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 128, format: password }
        mfa_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Wajib untuk admin.
    Session:
      type: object
      required: [staff, csrf_token, idle_timeout_seconds, session_expires_at]
      properties:
        staff:
          type: object
          required: [staff_id, name, role]
          properties:
            staff_id: { type: integer }
            name: { type: string }
            role: { $ref: '#/components/schemas/Role' }
        csrf_token: { type: string }
        idle_timeout_seconds: { type: integer, example: 900 }
        session_expires_at:
          type: string
          format: date-time
          description: Batas mutlak 8 jam sejak login.

    # ---------------------------------------------------------------- staff views (masked)
    MaskedPhone:
      type: string
      example: 0812••••890
    StaffFoundReport:
      type: object
      required: [report_id, status, category, color, source, expires_at, created_at, has_secret]
      properties:
        report_id: { $ref: '#/components/schemas/FoundReportCode' }
        status: { $ref: '#/components/schemas/FoundReportStatus' }
        category: { $ref: '#/components/schemas/CategoryOption' }
        color: { type: string }
        source: { type: string, enum: [aplikasi, pos] }
        finder_whatsapp_masked: { $ref: '#/components/schemas/MaskedPhone' }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        has_secret:
          type: boolean
          description: Ada deskripsi/foto/lokasi yang bisa dibuka lewat `reveal`.
    StaffItem:
      type: object
      required: [item_id, status, category, color, condition, storage_rack, received_at, received_by, active_flags]
      properties:
        item_id: { type: string, example: B-0462 }
        found_report_id: { $ref: '#/components/schemas/FoundReportCode' }
        status: { $ref: '#/components/schemas/ItemStatus' }
        category: { $ref: '#/components/schemas/CategoryOption' }
        color: { type: string }
        condition: { type: string, example: baik }
        storage_rack: { type: string, example: Rak B-2 }
        received_at: { type: string, format: date-time }
        received_by:
          type: object
          properties:
            staff_id: { type: integer }
            name: { type: string }
        active_flags:
          type: array
          description: Penanda A1/A2 yang relevan untuk barang ini (ditampilkan saat verifikasi).
          items: { type: string, enum: [A1, A2] }
    ItemSecrets:
      type: object
      description: Hanya field yang diminta. Field lain tidak ada di respons.
      properties:
        item_id: { type: string }
        in_verification: { type: boolean }
        description: { type: string }
        photo:
          type: object
          properties:
            url: { type: string, description: URL bertanda tangan, berlaku 5 menit. }
            expires_at: { type: string, format: date-time }
        found_location: { $ref: '#/components/schemas/LocationOption' }
        found_at: { type: string, format: date-time }
        finder_name: { type: string }
        finder_whatsapp: { type: string }
    StaffLostReport:
      type: object
      required: [report_id, status, category, color, created_at, has_secret]
      properties:
        report_id: { $ref: '#/components/schemas/LostReportCode' }
        status: { $ref: '#/components/schemas/LostReportStatus' }
        category: { $ref: '#/components/schemas/CategoryOption' }
        color: { type: string }
        reporter_whatsapp_masked: { $ref: '#/components/schemas/MaskedPhone' }
        closed_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        has_secret: { type: boolean }
    LostReportSecrets:
      type: object
      properties:
        report_id: { type: string }
        description: { type: string }
        lost_location: { $ref: '#/components/schemas/LocationOption' }
        lost_at: { type: string, format: date-time }
        reporter_name: { type: string }
        reporter_whatsapp: { type: string }

    ReceiveItemForm:
      type: object
      required: [condition, storage_rack]
      properties:
        condition: { type: string, example: baik }
        storage_rack: { type: string, maxLength: 30 }
        intake_photo:
          type: string
          description: Data URL base64 foto JPG/PNG/WEBP opsional; maksimal 4 MB sebelum encoding.
    WalkInForm:
      type: object
      required: [category_id, color, location_id, found_at, description, finder_whatsapp, condition, storage_rack, photo]
      properties:
        category_id: { type: integer }
        color: { type: string }
        location_id: { type: integer }
        found_at: { type: string, format: date-time }
        description: { type: string, minLength: 10, maxLength: 300 }
        finder_name: { type: string, maxLength: 60 }
        finder_whatsapp: { $ref: '#/components/schemas/PhoneNumber' }
        condition: { type: string }
        storage_rack: { type: string }
        photo: { type: string, format: binary }
        confirm_not_duplicate: { type: boolean, default: false }
    ItemReceived:
      type: object
      required: [item_id, status, storage_rack, received_at]
      properties:
        item_id: { type: string, example: B-0462 }
        status: { type: string, enum: [barang_ditemukan] }
        storage_rack: { type: string }
        photo_saved: { type: boolean }
        received_at: { type: string, format: date-time }
        label_to_print: { type: string, description: Teks label rak (Item ID). }
    ItemCorrection:
      type: object
      required: [reason]
      minProperties: 2
      properties:
        category_id: { type: integer }
        color: { type: string }
        condition: { type: string }
        storage_rack: { type: string }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ItemHistoryEntry:
      type: object
      required: [history_id, previous_status, new_status, staff, changed_at]
      properties:
        history_id: { type: integer, format: int64 }
        previous_status: { type: string, nullable: true }
        new_status: { type: string }
        staff:
          type: object
          properties:
            staff_id: { type: integer, nullable: true }
            name: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        changed_at: { type: string, format: date-time }

    # ---------------------------------------------------------------- matching / notification
    MatchResult:
      type: object
      required: [matching_id, lost_report_id, item_id, band, final_score, color_score, location_score, time_score, description_priority, notified, processed_at]
      properties:
        matching_id: { type: integer, format: int64 }
        lost_report_id: { $ref: '#/components/schemas/LostReportCode' }
        item_id: { type: string }
        lost_item_name: { type: string }
        item_name: { type: string }
        category: { type: string }
        lost_color: { type: string }
        item_color: { type: string }
        lost_location: { type: string }
        item_location: { type: string }
        storage_rack: { type: string }
        lost_at: { type: string, format: date-time }
        found_at: { type: string, format: date-time }
        band: { $ref: '#/components/schemas/MatchBand' }
        final_score:
          type: number
          format: double
          nullable: true
          description: 0-100, 2 desimal. null bila `data_tidak_memadai`.
        color_score: { type: number, nullable: true, description: "null = tidak dihitung (Lainnya)." }
        location_score: { type: number, nullable: true }
        time_score: { type: number, nullable: true }
        description_priority:
          type: number
          description: Jaccard 0-1. Hanya untuk urutan, tidak ikut skor.
        should_notify:
          type: boolean
          description: Kandidat mencapai ambang skor notifikasi; bukan bukti notifikasi terkirim.
        notified: { type: boolean }
        queued_for_review:
          type: boolean
          description: true bila skor tinggi tapi WA otomatis ditahan karena batas 3/nomor/hari.
        processed_at: { type: string, format: date-time }
    Notification:
      type: object
      required: [notification_id, event_type, status, attempt_count, created_at]
      properties:
        notification_id: { type: integer, format: int64 }
        matching_id: { type: integer, format: int64, nullable: true }
        event_type:
          type: string
          enum: [match, item_received, handover_proof, finder_closure, handover_warning]
        status: { $ref: '#/components/schemas/NotificationStatus' }
        attempt_count: { type: integer }
        sent_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    # ---------------------------------------------------------------- verification
    Verification:
      type: object
      required: [claim_id, item_id, status, started_at, active_flags]
      properties:
        claim_id: { type: integer, format: int64 }
        item_id: { type: string }
        lost_report_id: { $ref: '#/components/schemas/LostReportCode' }
        status:
          type: string
          enum: [berjalan, cocok, tidak_cocok, dibatalkan_otomatis]
        active_flags:
          type: array
          items: { type: string, enum: [A1, A2] }
        started_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: started_at + 30 menit.
        completed_at: { type: string, format: date-time, nullable: true }
    HandoverForm:
      type: object
      required: [id_type, claimant_name, id_last4, claimant_whatsapp, handover_photo]
      properties:
        id_type: { type: string, enum: [ktm, ktp, sim, paspor, lainnya] }
        claimant_name: { type: string, minLength: 3, maxLength: 60, description: Nama sesuai identitas. }
        id_last4:
          type: string
          pattern: '^[A-Za-z0-9]{4}$'
          description: 4 digit terakhir saja. Nomor lengkap ditolak.
        claimant_whatsapp: { $ref: '#/components/schemas/PhoneNumber' }
        lost_report_id: { $ref: '#/components/schemas/LostReportCode' }
        flag_note:
          type: string
          maxLength: 500
          description: Wajib bila ada penanda A1/A2 aktif.
        handover_photo:
          type: string
          format: binary
          description: Foto penerima + barang. **Bukan** foto KTP/KTM.

    # ---------------------------------------------------------------- admin
    StaffCreate:
      type: object
      required: [name, username, role]
      properties:
        name: { type: string, minLength: 3, maxLength: 60 }
        username: { type: string, minLength: 3, maxLength: 64 }
        role: { $ref: '#/components/schemas/Role' }
    StaffAccount:
      type: object
      required: [staff_id, name, username, role, is_active, is_locked]
      properties:
        staff_id: { type: integer }
        name: { type: string }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        is_active: { type: boolean }
        is_locked: { type: boolean }
        locked_until: { type: string, format: date-time, nullable: true }
        created_by: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
    AuditLogEntry:
      type: object
      required: [audit_id, actor_type, action, entity_type, created_at]
      properties:
        audit_id: { type: integer, format: int64 }
        actor_type: { type: string, enum: [staff, publik, sistem] }
        staff_id: { type: integer, nullable: true }
        action: { type: string, example: reveal_secret }
        entity_type: { type: string, example: item }
        entity_id: { type: string }
        old_value: { type: object, nullable: true, additionalProperties: true }
        new_value: { type: object, nullable: true, additionalProperties: true }
        reason: { type: string, nullable: true }
        ip_hash: { type: string }
        user_agent: { type: string }
        prev_hash: { type: string }
        entry_hash: { type: string }
        created_at: { type: string, format: date-time }
    AnomalyFlag:
      type: object
      required: [flag_id, rule_id, subject_type, subject_ref, status, created_at]
      properties:
        flag_id: { type: integer, format: int64 }
        rule_id: { type: string, enum: [A1, A2, A3, A4, A5, A6, A7, A8] }
        subject_type: { type: string, example: phone_hash }
        subject_ref: { type: string, description: Hash/ID, bukan nomor utuh. }
        detail: { type: string }
        status: { type: string, enum: [baru, ditinjau] }
        reviewed_by: { type: integer, nullable: true }
        review_note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time, nullable: true }
    Setting:
      type: object
      required: [key, value]
      properties:
        key: { type: string, example: match.threshold.high }
        value: { type: string, example: '80' }
        updated_by: { type: integer, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    CategoryWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
        is_high_value: { type: boolean, default: false }
        is_active: { type: boolean, default: true }
    CategoryAdmin:
      allOf:
        - $ref: '#/components/schemas/CategoryWrite'
        - type: object
          required: [category_id]
          properties:
            category_id: { type: integer }
    LocationWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        parent_location_id: { type: integer, nullable: true, description: Zona/gedung induk. }
        is_other: { type: boolean, default: false }
        is_active: { type: boolean, default: true }
    LocationAdmin:
      allOf:
        - $ref: '#/components/schemas/LocationWrite'
        - type: object
          required: [location_id]
          properties:
            location_id: { type: integer }

# ====================================================================== OPEN QUESTIONS
x-open-questions:
  - no: 1
    topic: Entitas pos (post) belum ada di ERD
    detail: FR-04 mewajibkan "pos satpam penyimpan" dan "jam layanan" di DTO publik, tetapi ERD v0.3 tidak punya tabel pos / kolom item.post_id. Jam layanan juga belum ada (OI06).
  - no: 2
    topic: Nilai enum condition
    detail: FSD hanya menyebut "kondisi". Nilai enum final (mis. baik, lecet, rusak) perlu ditetapkan SA/UI.
  - no: 3
    topic: Kapan laporan kehilangan menjadi memiliki_kandidat
    detail: AC-08 jelas untuk skor >= 80 (WA otomatis). Untuk skor 50-79 lalu satpam kirim WA manual, apakah status juga berubah? Usulan - ya, berubah saat WA terkirim (otomatis atau manual).
  - no: 4
    topic: WhatsApp penemu di jalur walk-in tidak lewat OTP
    detail: Satpam mengisi nomor penemu tanpa OTP, jadi WA "barang diterima" dan "kembali ke pemilik" bisa terkirim ke nomor yang tidak terverifikasi. Pertimbangkan konfirmasi lisan nomor, atau tanpa WA untuk walk-in.
  - no: 5
    topic: Format nomor WhatsApp
    detail: FSD bag. 5.1 menulis "10-14 digit setelah 0". Usulan - validasi 10-14 digit nasional (mis. 08xxxxxxxxx) setelah normalisasi; perlu konfirmasi karena rentang +62 dan 0 berbeda satu digit.
  - no: 6
    topic: Perilaku honeypot "tolak diam-diam"
    detail: Usulan - balas 201 dengan bentuk respons identik tetapi tidak menyimpan apa pun dan menghitung sebagai pemicu A8. Perlu keputusan apakah ID palsu boleh ditampilkan.
  - no: 7
    topic: Skor tinggi dengan dua komponen
    detail: Bila warna "Lainnya", lokasi sama + waktu <= 24 jam = skor 100 (otomatis WA). Ini konsekuensi normalisasi bobot di FR-07. Mohon dikonfirmasi disengaja atau perlu batas minimum komponen (lihat matching_spec.md bagian 6).
  - no: 8
    topic: Alur password awal akun satpam
    detail: FSD tidak menjelaskan cara password awal diberikan dan apakah wajib diganti. Endpoint ganti password belum ada di kontrak ini.
  - no: 9
    topic: Pemicu CAPTCHA
    detail: Provider CAPTCHA dan skema token belum diputuskan; di kontrak ini hanya `captcha_token` opsional.
