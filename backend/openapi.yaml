openapi: 3.0.3
info:
  title: Lost & Found Kampus UII - API Contract
  version: 0.1.0-draft
  description: |
    Draft API contract berdasarkan **FSD Lost & Found Kampus UII v0.3**.
    Status: DRAFT untuk divalidasi bareng BE, FE, DB, SOC, QA.

    ## Konvensi
    - Base path `/v1`. Semua waktu ISO 8601 dengan offset, disimpan UTC. FE menampilkan WIB.
    - Nilai enum memakai snake_case. Label tampilan (Indonesia) ada di tabel "Status".
    - Semua validasi dijalankan di server (FSD bag. 5). Pesan error per field.
    - Format error seragam: lihat schema `Error`. Pesan ke pengguna **selalu umum**, detail teknis hanya di log server (SEC-19).
    - Tiga kelompok endpoint: `public` (tanpa login, OTP WhatsApp), `staff` (satpam + admin), `admin` (admin + MFA).

    ## Status (label FSD -> kode API)
    | Objek | Kode API -> label |
    |---|---|
    | Laporan temuan | `menunggu_penyerahan` Menunggu Penyerahan, `diterima` Diterima, `ditolak` Ditolak, `kedaluwarsa` Kedaluwarsa |
    | Barang | `barang_ditemukan` Barang Ditemukan, `proses_verifikasi` Proses Verifikasi, `telah_diambil` Telah Diambil, `ditahan` Ditahan, `dilimpahkan` Dilimpahkan |
    | Laporan kehilangan | `aktif` Aktif, `memiliki_kandidat` Memiliki Kandidat, `selesai` Selesai, `ditutup` Ditutup |

    ## Keamanan
    - Staff: cookie sesi `lf_session` (HttpOnly, Secure, SameSite=Strict). Semua request ubah data wajib header `X-CSRF-Token` (didapat dari `POST /auth/login` atau `GET /auth/me`).
    - Otorisasi dicek **per aksi dan per objek** di server (SEC-03). Default deny.
    - Rate limit: respons `429` dengan header `Retry-After`. Angka batas di FSD 6.1.
    - `Idempotency-Key` (UUID v4) wajib di semua `POST` publik pembuat laporan dan di aksi serah terima.
      Key yang sama + body sama -> respons asli diulang (header `Idempotent-Replayed: true`). Key sama + body beda -> `422 IDEMPOTENCY_KEY_REUSED`. TTL key 24 jam.
    - Tidak ada endpoint publik untuk cek status laporan kehilangan (BR-03).

    ## Asumsi yang perlu dikonfirmasi
    Lihat bagian `x-open-questions` di paling bawah file.
  contact:
    name: Tim Study Case Lost & Found
servers:
  - url: https://lostfound.example.uii.ac.id/v1
    description: Placeholder (nama aplikasi & domain belum diputuskan, OI01)
tags:
  - name: public-meta
    description: Data dropdown formulir publik
  - name: public-otp
    description: FR-01 verifikasi OTP WhatsApp
  - name: public-report
    description: FR-02, FR-03 laporan kehilangan dan temuan
  - name: public-items
    description: FR-04 daftar barang publik (allowlist)
  - name: auth
    description: FR-05 login dan sesi
  - name: staff-intake
    description: FR-06 penerimaan barang
  - name: staff-items
    description: Daftar barang, data rahasia, koreksi (FR-10, FR-12)
  - name: staff-matching
    description: FR-07, FR-08 hasil matching dan notifikasi
  - name: staff-verification
    description: FR-11 verifikasi dan serah terima
  - name: staff-lost-reports
    description: Laporan kehilangan (sisi satpam)
  - name: admin
    description: FR-13 panel admin BSI

paths:
  # ------------------------------------------------------------------ PUBLIC META
  /public/meta/form-options:
    get:
      tags: [public-meta]
      summary: Opsi dropdown formulir (kategori, warna, lokasi)
      description: Hanya kategori dan lokasi `is_active = true`. Boleh di-cache singkat.
      operationId: getFormOptions
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [categories, colors, locations]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryOption' }
                  colors:
                    type: array
                    items: { $ref: '#/components/schemas/ColorOption' }
                  locations:
                    type: array
                    items: { $ref: '#/components/schemas/LocationOption' }

  # ------------------------------------------------------------------ PUBLIC OTP
  /public/otp/request:
    post:
      tags: [public-otp]
      summary: Minta kode OTP WhatsApp
      description: |
        Urutan di server (FR-01): normalisasi nomor ke +62 (tolak non-Indonesia) -> cek batas kirim ->
        buat kode 6 digit (CSPRNG), simpan hash, berlaku 5 menit, terikat nomor + tujuan -> kirim lewat template autentikasi WhatsApp.

        Batas: jeda 60 detik, 3/nomor/jam, 5/nomor/hari, 10/IP/jam. CAPTCHA wajib bila IP melewati batas atau terdeteksi bot.
        Respons **sama** apa pun status nomor di sistem (tidak membocorkan apakah nomor punya laporan).
        Kode OTP tidak pernah ada di respons, URL, atau log.
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: Permintaan diterima. Kode dikirim ke WhatsApp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestAccepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403':
          description: CAPTCHA diperlukan atau gagal (`CAPTCHA_REQUIRED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /public/otp/verify:
    post:
      tags: [public-otp]
      summary: Verifikasi kode OTP dan dapatkan token verifikasi
      description: |
        Maks. 5 percobaan salah per kode, lalu kode hangus dan nomor dikunci 15 menit (`429 OTP_LOCKED`).
        Kode benar -> ditandai terpakai, server menerbitkan token verifikasi (berlaku 15 menit, sekali pakai,
        terikat nomor + tujuan) yang wajib dibawa saat formulir dikirim.

        Semua kegagalan (salah, kedaluwarsa, sudah dipakai, tidak ada) memakai pesan yang sama:
        `Kode salah atau kedaluwarsa`.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerify' }
      responses:
        '200':
          description: OTP benar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerified' }
        '400':
          description: Kode salah / kedaluwarsa (`OTP_INVALID`) atau format salah (`VALIDATION_ERROR`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Nomor terkunci 15 menit (`OTP_LOCKED`) atau rate limit.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------------------ PUBLIC REPORTS
  /public/lost-reports:
    post:
      tags: [public-report]
      summary: Buat laporan kehilangan (FR-02)
      description: |
        Validasi server -> cek token OTP -> cek rate limit (3/nomor/jam, 10/IP/jam) -> simpan status `aktif`
        dengan ID acak `HL-XXXX-XXXX` -> jalankan matching (FR-07).
        Laporan kehilangan **tidak pernah** tampil di publik dan tidak ada endpoint cek status (BR-03).

        Honeypot (`website`) terisi -> tolak diam-diam (lihat `x-open-questions` no. 6).
      operationId: createLostReport
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostReportCreate' }
      responses:
        '201':
          description: Laporan tersimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostReportCreated' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/TokenInvalidOrIdempotency' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/found-reports:
    post:
      tags: [public-report]
      summary: Buat laporan temuan (FR-03)
      description: |
        Multipart karena ada foto opsional. Status awal `menunggu_penyerahan`, berlaku 1x24 jam
        (`expires_at`), ID `TM-XXXX-XXXX`. Tidak tampil di publik dan tidak ikut matching sebelum diterima satpam.
        Foto: JPG/PNG/WebP, maks. 5 MB, maks. 4000x4000 px, dicek magic bytes, di-encode ulang, EXIF dihapus (FSD 6.4).
      operationId: createFoundReport
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/FoundReportCreate' }
            encoding:
              photo:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Laporan tersimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundReportCreated' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '413':
          description: File lebih dari 5 MB (`FILE_TOO_LARGE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Tipe file bukan JPG/PNG/WebP berdasarkan isi file (`UNSUPPORTED_MEDIA_TYPE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/TokenInvalidOrIdempotency' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ------------------------------------------------------------------ PUBLIC ITEMS
  /public/items:
    get:
      tags: [public-items]
      summary: Daftar barang publik (FR-04)
      description: |
        Hanya barang berstatus `barang_ditemukan`. Filter **hanya** kategori dan warna.
        Urutan tetap (terbaru masuk lebih dulu) dan **tidak** bisa diubah klien. Parameter lain (`sort`, `fields`,
        `include`, dst.) diabaikan atau ditolak 400, tidak pernah memengaruhi output
        (sort berdasar kolom rahasia bisa membocorkan data lewat urutan).
        Respons memakai DTO allowlist, difilter di server, bukan di frontend (SEC-04).
      operationId: listPublicItems
      security: []
      parameters:
        - name: category_id
          in: query
          schema: { type: integer }
        - name: color
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page, page_size, total]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicItem' }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }

  /public/items/{item_id}:
    get:
      tags: [public-items]
      summary: Detail barang publik (FR-04)
      description: |
        Field publik + langkah pengambilan di pos. Item berstatus selain `barang_ditemukan` -> `404` (sama persis
        dengan item yang tidak ada, supaya status tidak bocor).
      operationId: getPublicItem
      security: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicItemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ AUTH
  /auth/login:
    post:
      tags: [auth]
      summary: Login staf (FR-05)
      description: |
        Hash Argon2id/bcrypt. 5x gagal berturut-turut -> akun terkunci 15 menit dan dicatat (penanda A5 di 3x gagal).
        Limit 20 percobaan/IP/jam. Sesi dibuat ulang setelah login (anti session fixation).
        Idle 15 menit -> logout otomatis, maksimal 8 jam. Admin wajib `mfa_code`.

        **Semua** kegagalan (salah username, salah password, akun terkunci, nonaktif, MFA salah)
        mengembalikan respons identik: `401` + `Username atau password salah`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login berhasil. Header `Set-Cookie` berisi cookie sesi.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "lf_session=...; HttpOnly; Secure; SameSite=Strict; Path=/"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: Kredensial salah / akun terkunci / nonaktif. Pesan sama untuk semua.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout
      operationId: logout
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          description: Sesi dihancurkan.
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/me:
    get:
      tags: [auth]
      summary: Info sesi saat ini
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ------------------------------------------------------------------ STAFF INTAKE
  /staff/found-reports:
    get:
      tags: [staff-intake]
      summary: Cari laporan temuan
      description: Role `satpam`, `admin` (baca). Field rahasia tersamar; dibuka lewat endpoint `reveal`.
      operationId: listFoundReports
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/FoundReportStatus' }
        - name: q
          in: query
          description: Cari persis berdasarkan ID laporan (TM-...). Bukan pencarian teks bebas.
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page, page_size, total]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StaffFoundReport' }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /staff/found-reports/{report_id}:
    get:
      tags: [staff-intake]
      summary: Detail laporan temuan (tersamar)
      operationId: getFoundReport
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FoundReportId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffFoundReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /staff/found-reports/pending:
    get:
      tags: [staff-intake]
      summary: Ambil antrean penerimaan dan statistik
      description: Role `satpam`. Statistik dihitung dari data penerimaan di database; hari mengikuti WIB.
      operationId: listPendingFoundReports
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Antrean laporan menunggu penyerahan dan statistik penerimaan.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, stats]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        report_id: { type: string }
                        status: { type: string }
                        category_id: { type: integer, format: int64 }
                        color: { type: string }
                        location_id: { type: integer, format: int64 }
                        item_name: { type: string }
                        found_at: { type: string, format: date-time }
                        description: { type: string }
                        finder_name: { type: string }
                        finder_whatsapp: { type: string }
                        source: { type: string }
                        created_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
                  total: { type: integer }
                  stats:
                    type: object
                    required: [expiring_soon, pending_total, received_today, active_items]
                    properties:
                      expiring_soon:
                        type: integer
                        description: Laporan aktif yang kedaluwarsa dalam 3 jam ke depan.
                      pending_total: { type: integer, description: Total laporan aktif menunggu penyerahan. }
                      received_today: { type: integer, description: Barang diterima hari ini menurut WIB. }
                      active_items: { type: integer, description: Item dengan status Barang Ditemukan. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Gagal mengambil antrean atau statistik.

  /staff/items:
    get:
      tags: [staff-intake]
      summary: Ambil daftar inventaris tersimpan
      description: Mengambil seluruh item yang sudah tersimpan pada tabel `item`, dari yang terbaru diterima.
      operationId: listInventoryItems
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Daftar inventaris tersimpan.
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [item_id, item_name, category_name, color, condition, storage_rack, received_at, received_by_name, received_by_username, status, has_photo]
                      properties:
                        item_id: { type: string }
                        item_name: { type: string }
                        category_name: { type: string }
                        color: { type: string }
                        condition: { type: string }
                        storage_rack: { type: string }
                        received_at: { type: string, format: date-time }
                        received_by_name: { type: string }
                        received_by_username: { type: string }
                        status: { type: string, enum: [Barang Ditemukan, Proses Verifikasi, Telah Diambil, Ditahan] }
                        has_photo: { type: boolean }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Gagal mengambil daftar inventaris.

  /staff/found-reports/{report_id}/receive:
    post:
      tags: [staff-intake]
      summary: Terima barang dari laporan temuan (FR-06)
      description: |
        Role `satpam`. Foto dokumentasi opsional; penerimaan tetap dapat disimpan tanpa foto.
        Jika disertakan, foto disimpan bersama data item dengan ukuran maksimal 4 MB.
        Dalam satu transaksi: buat `item` berstatus `barang_ditemukan` dan ubah status laporan menjadi `diterima`.
        Setelah transaksi berhasil, catat penerimaan ke `audit_log`.
        Hanya laporan `menunggu_penyerahan` yang belum kedaluwarsa yang bisa diterima.
      operationId: receiveFoundReport
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/FoundReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiveItemForm' }
      responses:
        '201':
          description: Barang diterima.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemReceived' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/found-reports/{report_id}/receipt/send:
    post:
      tags: [staff-intake]
      summary: Kirim bukti penerimaan melalui WhatsApp
      description: Mengirim pesan bukti kepada nomor WhatsApp penemu setelah barang tersimpan.
      operationId: sendFoundReceipt
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/FoundReportId'
      responses:
        '200':
          description: Pesan bukti berhasil dikirim ke provider WhatsApp.
          content:
            application/json:
              schema:
                type: object
                required: [status, report_id, item_id]
                properties:
                  status: { type: string, enum: [sent] }
                  report_id: { type: string }
                  item_id: { type: string }
        '409': { $ref: '#/components/responses/Conflict' }
        '500':
          description: Gagal mengambil data penerimaan dari database.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        '502':
          description: Provider WhatsApp gagal mengirim pesan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /staff/found-reports/{report_id}/reject:
    post:
      tags: [staff-intake]
      summary: Tolak laporan temuan
      description: Role `satpam`. Alasan wajib. Transisi `menunggu_penyerahan -> ditolak`.
      operationId: rejectFoundReport
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/FoundReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffFoundReport' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/items/walk-in:
    post:
      tags: [staff-intake]
      summary: Terima barang dari penemu tanpa laporan (UC-07, AC-07)
      description: |
        Role `satpam`. Satpam mengisi formulir atas nama penemu asli. Identitas satpam pencatat disimpan terpisah
        (`created_by_staff_id`), tidak menimpa data penemu. `source = pos`. Membuat `found_report` + `item` dalam satu transaksi.
        Pengecekan duplikat: ada laporan TM aktif dengan kategori + warna sama dalam 24 jam terakhir -> `409 DUPLICATE_SUSPECTED`
        (satpam bisa kirim ulang dengan `confirm_not_duplicate = true`, tercatat di audit).
        Nomor WhatsApp penemu di jalur ini **tidak** diverifikasi OTP (lihat `x-open-questions` no. 4).
      operationId: createWalkInItem
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/WalkInForm' }
            encoding:
              photo:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Barang diterima.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemReceived' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ STAFF ITEMS
  /staff/items:
    get:
      tags: [staff-items]
      summary: Daftar barang (tersamar)
      operationId: listStaffItems
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ItemStatus' }
        - name: item_id
          in: query
          description: Cari persis berdasarkan Item ID.
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page, page_size, total]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StaffItem' }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /staff/items/{item_id}:
    get:
      tags: [staff-items]
      summary: Detail barang (tersamar)
      description: Deskripsi, foto, lokasi, waktu penemuan dan kontak **tidak** disertakan. Gunakan `reveal`.
      operationId: getStaffItem
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /staff/items/{item_id}/reveal:
    post:
      tags: [staff-items]
      summary: Buka data rahasia barang (FR-10)
      description: |
        Role `satpam`. **Setiap pemanggilan** menulis `audit_log` (satpam, waktu, objek, field yang dibuka,
        apakah sedang `proses_verifikasi`). Lebih dari 3 pembukaan/jam/satpam di luar Proses Verifikasi -> penanda A3.
        URL foto ditandatangani, berlaku 5 menit. Tidak boleh di-cache (`Cache-Control: no-store`).
        Dipakai POST (bukan GET) karena punya efek samping (audit).
      operationId: revealItem
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [description, photo, found_location, found_at, finder_name, finder_whatsapp]
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemSecrets' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /staff/items/{item_id}/corrections:
    post:
      tags: [staff-items]
      summary: Koreksi data barang (FR-12)
      description: |
        Role `satpam`. Boleh mengoreksi `category_id`, `color`, `condition`, `storage_rack`. Alasan wajib.
        Hanya mengubah tabel `item`; data asli penemu tidak berubah. Audit menyimpan nilai lama dan baru.
        Perubahan kategori/warna setelah diterima -> penanda A4. Koreksi memicu matching ulang.
      operationId: correctItem
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemCorrection' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/items/{item_id}/history:
    get:
      tags: [staff-items]
      summary: Riwayat status barang (FR-09)
      operationId: getItemHistory
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemHistoryEntry' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ STAFF LOST REPORTS
  /staff/lost-reports:
    get:
      tags: [staff-lost-reports]
      summary: Daftar laporan kehilangan (tersamar)
      operationId: listLostReports
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LostReportStatus' }
        - name: report_id
          in: query
          description: Cari persis berdasarkan ID laporan (HL-...).
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page, page_size, total]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StaffLostReport' }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /staff/lost-reports/{report_id}/reveal:
    post:
      tags: [staff-lost-reports]
      summary: Buka data rahasia laporan kehilangan (FR-10)
      description: Sama dengan reveal barang. Tercatat di audit, respons `Cache-Control no-store`.
      operationId: revealLostReport
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/LostReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [description, lost_location, lost_at, reporter_name, reporter_whatsapp]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostReportSecrets' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /staff/lost-reports/{report_id}/close:
    post:
      tags: [staff-lost-reports]
      summary: Tutup laporan kehilangan (UC-12)
      description: Role `satpam`. Alasan wajib. `aktif`/`memiliki_kandidat` -> `ditutup`. (Penutupan otomatis 60 hari dilakukan job harian.)
      operationId: closeLostReport
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/LostReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffLostReport' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ MATCHING & NOTIF
  /staff/matches:
    get:
      tags: [staff-matching]
      summary: Daftar hasil matching (UC-08)
      description: |
        Pasangan dihitung dari item berstatus `Barang Ditemukan` dan laporan berstatus aktif,
        lalu skor terbaru dicatat di `matching_result`. Hanya `tinggi` dan `sedang` yang
        ditampilkan (`rendah` disimpan untuk analisis, tidak ditampilkan). Urutan:
        `final_score` turun, lalu `description_priority` turun. Rincian perbandingan aman
        untuk petugas dan skor per komponen disertakan; deskripsi lengkap dan kontak pelapor tidak.
      operationId: listMatches
      security:
        - cookieAuth: []
      parameters:
        - name: band
          in: query
          schema: { type: string, enum: [tinggi, sedang] }
        - name: needs_review
          in: query
          description: true = hanya yang butuh dicek (sedang, atau tinggi yang masuk antrean karena batas harian WA).
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page, page_size, total, evaluated_pairs, summary]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MatchResult' }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  evaluated_pairs:
                    type: integer
                    description: Jumlah pasangan kategori aktif yang dihitung.
                  summary:
                    type: object
                    required: [high, medium, notified, needs_review]
                    properties:
                      high: { type: integer }
                      medium: { type: integer }
                      notified: { type: integer }
                      needs_review: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /staff/matches/{matching_id}/notify:
    post:
      tags: [staff-matching]
      summary: Kirim WhatsApp kecocokan manual (FR-08)
      description: |
        Role `satpam`. Satu notifikasi per pasangan laporan + barang: sudah pernah dikirim -> `409 ALREADY_NOTIFIED`.
        Isi pesan memakai template tetap, tanpa tautan dan tanpa detail barang.
      operationId: notifyMatch
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: matching_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '202':
          description: Notifikasi masuk antrean.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/notifications:
    get:
      tags: [staff-matching]
      summary: Daftar notifikasi WhatsApp
      operationId: listNotifications
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/NotificationStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page, page_size, total]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /staff/notifications/{notification_id}/resend:
    post:
      tags: [staff-matching]
      summary: Kirim ulang notifikasi yang gagal (UC-14)
      description: Hanya notifikasi berstatus `gagal`. Pengiriman ulang otomatis maks. 3x (jeda 1, 5, 30 menit) sudah dilakukan sistem sebelum status `gagal`.
      operationId: resendNotification
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '202':
          description: Masuk antrean.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ VERIFICATION
  /staff/items/{item_id}/verifications:
    post:
      tags: [staff-verification]
      summary: Mulai verifikasi kepemilikan (FR-11 langkah 1-2)
      description: |
        Role `satpam`. Item `barang_ditemukan -> proses_verifikasi` secara atomik (kunci database, satu proses per barang).
        Respons berisi penanda A1/A2 aktif untuk ditampilkan ke satpam. Tanpa aksi 30 menit -> job mengembalikan item ke `barang_ditemukan`.
        Hanya barang `barang_ditemukan` yang bisa diverifikasi (`ditahan` tidak).
      operationId: startVerification
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lost_report_id:
                  type: string
                  description: ID laporan kehilangan yang disebut pemohon (opsional).
                  example: HL-3M7R-9DQ2
      responses:
        '201':
          description: Verifikasi dimulai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verification' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/verifications/{claim_id}/reject:
    post:
      tags: [staff-verification]
      summary: Hasil verifikasi - Tidak cocok (FR-11 langkah 7)
      description: Alasan wajib. Klaim ditolak tercatat, item kembali `barang_ditemukan`, penanda A1/A2 diperbarui.
      operationId: rejectVerification
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verification' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/verifications/{claim_id}/handover:
    post:
      tags: [staff-verification]
      summary: Hasil verifikasi - Cocok, serah terima (FR-11 langkah 5-6)
      description: |
        Role `satpam` yang memulai verifikasi tersebut (admin tidak boleh menyerahkan barang). Foto serah terima **wajib**.
        Dilarang mengirim foto KTP/KTM dan nomor identitas lengkap (BR-10): hanya `id_type`, nama sesuai identitas, 4 digit terakhir.

        Dalam satu transaksi dengan row lock: item `proses_verifikasi -> telah_diambil`, klaim `cocok`, laporan kehilangan terkait `selesai`,
        `item_history` + `audit_log`. Dua permintaan bersamaan -> tepat satu sukses, lainnya `409 ALREADY_HANDED_OVER` atau `409 INVALID_STATE_TRANSITION`.
        Bila ada penanda A1/A2 aktif, `flag_note` wajib.
        Nomor WhatsApp penerima beda dari pelapor kehilangan terkait -> penanda A7 + WhatsApp peringatan ke pelapor asli.
        WhatsApp bukti dikirim ke penerima dan penemu (di luar transaksi).
      operationId: handoverItem
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/HandoverForm' }
            encoding:
              handover_photo:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Serah terima selesai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verification' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ ADMIN
  /admin/staff:
