services:
  postgres:
    image: postgres:16
    container_name: lostfound-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lostfound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di backend/.env}
      POSTGRES_DB: lostfound
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lostfound_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostfound -d lostfound"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lostfound_data:
