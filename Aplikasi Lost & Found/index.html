<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reclaim — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy: #12304a;
            --blue: #147d9a;
            --blue-dark: #106b83;
            --cream: #f7f6f1;
            --line: #dfe7eb;
            --text: #1d2b36;
            --muted: #75848e;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 82% 12%, rgba(255, 255, 255, .55), transparent 19%),
                linear-gradient(135deg, #eaf1f2 0%, #f7f6f1 100%);
        }

        .shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(360px, 54%) minmax(380px, 46%);
        }

        .brand-panel {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 42px 58px 44px;
            color: var(--white);
            background:
                linear-gradient(145deg, rgba(18, 48, 74, .08), rgba(18, 48, 74, .08)),
                var(--navy);
        }

        .brand-panel::before,
        .brand-panel::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .brand-panel::before {
            width: 520px;
            height: 520px;
            right: -290px;
            bottom: -210px;
            border: 92px solid rgba(255, 255, 255, .035);
        }

        .brand-panel::after {
            width: 240px;
            height: 240px;
            left: -155px;
            top: 155px;
            border: 44px solid rgba(255, 255, 255, .025);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1;
        }

        .brand-mark {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #eff8f7;
            color: var(--navy);
        }

        .brand-mark svg {
            width: 23px;
            height: 23px;
        }

        .brand-name {
            font-family: "Manrope", sans-serif;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -.3px;
        }

        .hero {
            z-index: 1;
            max-width: 620px;
            margin: auto 0;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: #9dd0d8;
        }

        .eyebrow::before {
            content: "";
            width: 34px;
            height: 2px;
            background: #80bdc8;
        }

        .hero h1 {
            max-width: 560px;
            margin: 0;
            font-family: "Manrope", sans-serif;
            font-size: clamp(44px, 5vw, 68px);
            line-height: 1.04;
            letter-spacing: -3.2px;
        }

        .hero h1 span {
            color: #82bfc9;
        }

        .hero p {
            max-width: 500px;
            margin: 24px 0 0;
            color: #c7d3da;
            font-size: 17px;
            line-height: 1.7;
        }

        .panel-footer {
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #aebdc5;
            font-size: 13px;
        }

        .panel-footer .line {
            width: 1px;
            height: 26px;
            background: rgba(255, 255, 255, .18);
        }

        .login-panel {
            display: grid;
            place-items: center;
            padding: 48px;
            background: rgba(247, 246, 241, .88);
        }

        .login-card {
            width: min(410px, 100%);
        }

        .login-card h2 {
            margin: 0 0 8px;
            font-family: "Manrope", sans-serif;
            font-size: 34px;
            line-height: 1.2;
            letter-spacing: -1.4px;
        }

        .subtitle {
            margin: 0 0 34px;
            color: var(--muted);
            font-size: 15px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #465865;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap svg {
            position: absolute;
            left: 16px;
            top: 50%;
            width: 18px;
            height: 18px;
            transform: translateY(-50%);
            color: #8e9aa2;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 54px;
            border: 1px solid var(--line);
            border-radius: 9px;
            outline: none;
            background: var(--white);
            color: var(--text);
            padding: 0 48px;
            font: 500 15px "DM Sans", sans-serif;
            transition: border-color .2s, box-shadow .2s;
        }

        input::placeholder {
            color: #adb7bd;
        }

        input:focus {
            border-color: #73adb9;
            box-shadow: 0 0 0 4px rgba(20, 125, 154, .08);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border: 0;
            background: transparent;
            color: #87969e;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .toggle-password svg {
            position: static;
            width: 19px;
            height: 19px;
            transform: none;
        }

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 4px 0 24px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #62727c;
        }

        .remember input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: var(--blue);
        }

        .forgot {
            color: var(--blue-dark);
            text-decoration: none;
            font-weight: 700;
        }

        .login-button {
            width: 100%;
            height: 54px;
            border: 0;
            border-radius: 9px;
            background: var(--blue);
            color: var(--white);
            font: 700 15px "DM Sans", sans-serif;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(20, 125, 154, .16);
            transition: .2s ease;
        }

        .login-button:hover {
            background: var(--blue-dark);
            transform: translateY(-1px);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 26px 0 20px;
            color: #9aa5ab;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .staff-button {
            width: 100%;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--white);
            color: #52646f;
            font: 700 14px "DM Sans", sans-serif;
            cursor: pointer;
        }

        .staff-button svg {
            width: 18px;
            height: 18px;
        }

        .register {
            margin: 30px 0 0;
            text-align: center;
            color: #7b8991;
            font-size: 13px;
        }

        .register a {
            color: var(--blue-dark);
            font-weight: 700;
            text-decoration: none;
        }

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            max-width: 330px;
            padding: 14px 18px;
            border-radius: 8px;
            background: var(--navy);
            color: var(--white);
            font-size: 13px;
            box-shadow: 0 14px 30px rgba(18, 48, 74, .18);
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: .25s;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 900px) {
            .shell {
                grid-template-columns: 42% 58%;
            }

            .brand-panel {
                padding: 32px 30px;
            }

            .hero h1 {
                font-size: 42px;
                letter-spacing: -2px;
            }

            .hero p {
                font-size: 15px;
            }
        }

        @media (max-width: 680px) {
            .shell {
                display: block;
            }

            .brand-panel {
                min-height: 300px;
                padding: 28px 24px;
            }

            .hero {
                margin: 55px 0 20px;
            }

            .hero h1 {
                font-size: 38px;
            }

            .hero p {
                max-width: 420px;
                margin-top: 14px;
            }

            .panel-footer {
                display: none;
            }

            .login-panel {
                min-height: calc(100vh - 300px);
                padding: 44px 24px;
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <section class="brand-panel">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3.5 8.5h17v10h-17z" />
                        <path d="M7.5 8.5V6a4.5 4.5 0 0 1 9 0v2.5" />
                        <path d="M8.5 13h7" />
                        <path d="M12 10v6" />
                    </svg>
                </div>
                <span class="brand-name">Reclaim</span>
            </div>

            <div class="hero">
                <div class="eyebrow">Lost & Found</div>
                <h1>Temukan kembali <span>barangmu.</span></h1>
                <p>Satu tempat untuk melaporkan, menemukan, dan mengembalikan barang dengan aman.</p>
            </div>

            <div class="panel-footer">
                <span>© 2026 Reclaim</span>
                <span class="line"></span>
                <span>Campus Lost & Found</span>
            </div>
        </section>

        <section class="login-panel">
            <div class="login-card">
                <h2>Selamat datang</h2>
                <p class="subtitle">Masuk untuk melanjutkan ke dashboard.</p>

                <form id="loginForm">
                    <div class="field">
                        <label for="email">Email</label>
                        <div class="input-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="14" rx="2" />
                                <path d="m4 7 8 6 8-6" />
                            </svg>
                            <input id="email" type="email" placeholder="nama@email.com" autocomplete="email" required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="4" y="10" width="16" height="11" rx="2" />
                                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                                <path d="M12 14v3" />
                            </svg>
                            <input id="password" type="password" placeholder="Masukkan password"
                                autocomplete="current-password" required>
                            <button class="toggle-password" type="button" aria-label="Tampilkan password"
                                id="togglePassword">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                                    <circle cx="12" cy="12" r="2.5" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="options">
                        <label class="remember"><input type="checkbox"> Ingat saya</label>
                        <a class="forgot" href="#">Lupa password?</a>
                    </div>

                    <button class="login-button" type="submit">Masuk ke Dashboard</button>
                </form>

                <div class="divider">atau</div>

                <button class="staff-button" id="staffButton">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21a8 8 0 0 1 16 0" />
                    </svg>
                    Masuk sebagai Petugas
                </button>

                <p class="register">Belum punya akun? <a href="#">Daftar sekarang</a></p>
            </div>
        </section>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script>
        const password = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const toast = document.getElementById('toast');

        togglePassword.addEventListener('click', () => {
            const visible = password.type === 'text';
            password.type = visible ? 'password' : 'text';
            togglePassword.setAttribute('aria-label', visible ? 'Tampilkan password' : 'Sembunyikan password');
        });

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
        }

        document.getElementById('loginForm').addEventListener('submit', (event) => {
            event.preventEvent?.();
            event.preventDefault();
            showToast('Berhasil masuk. Mengarahkan ke dashboard…');
        });

        document.getElementById('staffButton').addEventListener('click', () => {
            showToast('Mode petugas dipilih. Silakan masukkan kredensial.');
            document.getElementById('email').focus();
        });
    </script>
</body>

</html>
